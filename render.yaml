services:
  - type: web
    name: nbfc-loan-portal
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas URI in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
